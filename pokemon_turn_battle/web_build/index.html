<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#57566b">
<meta name="description" content="Demo jogável de um sistema de batalha por turnos estilo Pokémon FireRed, visual Game Boy.">
<title>Pocket Battle — Demo Jogável</title>
</head>
<body>
<style>
  :root {
    --gb-lightest: #9bbc0f;
    --gb-light: #8bac0f;
    --gb-dark: #306230;
    --gb-darkest: #0f380f;
    --shell: #86859c;
    --shell-hi: #9796ac;
    --shell-lo: #57566b;
    --shell-shadow: #38374a;
    --led-red: #d1372f;
    --led-red-dim: #6e2320;
    --paper: #eef0e2;
    --page-bg-light: #d8d5c8;
    --page-bg-dark: #131219;
    --hp-green: #58d068;
    --hp-yellow: #f8d030;
    --hp-red: #f83030;
    --font-mono: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
  }
  :root { --page-bg: var(--page-bg-light); }
  @media (prefers-color-scheme: dark) { :root { --page-bg: var(--page-bg-dark); } }
  :root[data-theme="dark"] { --page-bg: var(--page-bg-dark); }
  :root[data-theme="light"] { --page-bg: var(--page-bg-light); }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    font-family: var(--font-mono);
    color: var(--gb-darkest);
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    padding: clamp(0.5rem, 3vw, 2rem);
  }

  .page__hint {
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--page-bg) 30%, var(--gb-darkest) 70%);
    opacity: 0.65;
    text-align: center;
  }

  .console {
    width: min(96vw, 720px);
    background: linear-gradient(160deg, var(--shell-hi), var(--shell) 55%, var(--shell-lo));
    border-radius: 22px;
    padding: clamp(0.7rem, 2vw, 1.4rem) clamp(0.8rem, 2.4vw, 1.7rem) 1.1rem;
    box-shadow:
      0 2px 0 var(--shell-hi) inset,
      0 -6px 14px var(--shell-shadow) inset,
      0 18px 34px rgba(0, 0, 0, 0.35);
    position: relative;
  }

  .console__top {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0.2rem 0.6rem;
  }
  .console__led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8b83, var(--led-red) 60%, var(--led-red-dim));
    box-shadow: 0 0 6px var(--led-red);
    flex: none;
  }
  .console__brand {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--shell-shadow);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .console__screen-frame {
    background: linear-gradient(150deg, var(--shell-lo), var(--shell-shadow));
    border-radius: 10px;
    padding: clamp(0.6rem, 2.4vw, 1.1rem);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4) inset;
  }

  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--gb-lightest);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--gb-darkest) inset;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(15, 56, 15, 0.07) 0px,
      rgba(15, 56, 15, 0.07) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  .view.hidden { display: none; }

  /* ---------- Title view ---------- */
  #view-title {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.7em;
    padding: 6%;
  }
  .title-heading {
    margin: 0;
    font-size: clamp(1rem, 5.4vw, 1.6rem);
    line-height: 1.15;
    letter-spacing: 0.03em;
    color: var(--gb-darkest);
    text-wrap: balance;
  }
  .title-sub {
    margin: 0;
    font-size: clamp(0.6rem, 2vw, 0.78rem);
    color: var(--gb-dark);
    letter-spacing: 0.04em;
  }
  .title-blink {
    margin-top: 0.6em;
    font-size: clamp(0.6rem, 2vw, 0.75rem);
    letter-spacing: 0.08em;
    color: var(--gb-darkest);
    animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .title-blink { animation: none; opacity: 1; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  .btn-play {
    margin-top: 0.4em;
    font-family: inherit;
    font-size: clamp(0.72rem, 2.4vw, 0.9rem);
    letter-spacing: 0.08em;
    padding: 0.7em 1.6em;
    background: var(--gb-darkest);
    color: var(--gb-lightest);
    border: 2px solid var(--gb-darkest);
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-play:active { transform: translateY(1px); }

  /* ---------- Starter select view ---------- */
  #view-select { padding: 4% 4% 3%; gap: 2%; }
  .select-title {
    margin: 0 0 1%;
    font-size: clamp(0.62rem, 2.2vw, 0.85rem);
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--gb-darkest);
  }
  .select-body {
    flex: 1;
    display: flex;
    gap: 3%;
    min-height: 0;
  }
  .region-list {
    flex: 0 0 26%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4%;
    overflow-y: auto;
    background: color-mix(in srgb, var(--gb-dark) 30%, transparent);
    border-radius: 6px;
    padding: 3%;
  }
  .region-btn {
    font-family: inherit;
    font-size: clamp(0.5rem, 1.7vw, 0.68rem);
    letter-spacing: 0.03em;
    padding: 0.5em 0.3em;
    border: 1px solid var(--gb-darkest);
    border-radius: 3px;
    background: var(--paper);
    color: var(--gb-darkest);
    cursor: pointer;
    touch-action: manipulation;
  }
  .region-btn.active {
    background: var(--gb-darkest);
    color: var(--gb-lightest);
  }
  .starter-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    background: color-mix(in srgb, var(--gb-dark) 30%, transparent);
    border-radius: 6px;
    padding: 3%;
  }
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4%;
  }
  .starter-card {
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    gap: 0.3em;
    background: var(--paper);
    border: 1px solid var(--gb-darkest);
    border-radius: 5px;
    padding: 0.4em 0.2em 0.5em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .starter-card img {
    width: 60%;
    aspect-ratio: 1;
    image-rendering: pixelated;
  }
  .starter-card span {
    width: 100%;
    min-width: 0;
    font-size: clamp(0.44rem, 1.5vw, 0.62rem);
    letter-spacing: 0.02em;
    text-align: center;
    overflow-wrap: break-word;
    color: var(--gb-darkest);
  }
  .detail-panel {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 3%;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 6px;
    padding: 2.5%;
    margin-top: 2%;
  }
  .detail-panel.hidden { display: none; }
  .detail-panel img { width: clamp(38px, 10vw, 60px); aspect-ratio: 1; image-rendering: pixelated; flex: none; }
  .detail-info { flex: 1; min-width: 0; }
  .detail-info h3 {
    margin: 0 0 0.2em;
    font-size: clamp(0.6rem, 2vw, 0.78rem);
  }
  .detail-info p {
    margin: 0;
    font-size: clamp(0.48rem, 1.6vw, 0.62rem);
    white-space: pre-line;
    color: var(--gb-dark);
  }
  .detail-actions { display: flex; flex-direction: column; gap: 0.3em; flex: none; }
  .detail-actions button {
    font-family: inherit;
    font-size: clamp(0.48rem, 1.6vw, 0.62rem);
    letter-spacing: 0.04em;
    padding: 0.5em 0.7em;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #btnConfirmStarter { background: var(--gb-darkest); color: var(--gb-lightest); border: 2px solid var(--gb-darkest); }
  #btnCancelStarter { background: transparent; color: var(--gb-darkest); border: 1px solid var(--gb-darkest); }

  /* ---------- Battle view ---------- */
  #view-battle { inset: 0; }
  .battle-sprite {
    position: absolute;
    image-rendering: pixelated;
    object-fit: contain;
  }
  #enemySprite { left: 6%; top: 5%; width: 34%; height: 36%; }
  #playerSprite { left: 58%; top: 39%; width: 34%; height: 28%; }

  .info-panel {
    position: absolute;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 5px;
    padding: 2% 4%;
  }
  #enemyPanel { left: 46%; top: 4%; width: 48%; height: 26%; }
  #playerPanel { left: 4%; top: 37%; width: 46%; height: 29%; }
  .info-panel__row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: clamp(0.5rem, 1.7vw, 0.72rem);
  }
  .info-panel__name { font-weight: 700; }
  .hp-track {
    margin-top: 4%;
    height: 14%;
    min-height: 6px;
    background: var(--gb-darkest);
    border-radius: 3px;
    overflow: hidden;
  }
  .hp-fill { height: 100%; width: 100%; background: var(--hp-green); transition: width 0.4s steps(10); }
  .hp-numeric {
    margin-top: 2%;
    text-align: right;
    font-size: clamp(0.46rem, 1.5vw, 0.6rem);
    font-variant-numeric: tabular-nums;
    color: var(--gb-dark);
  }

  .battle-bottom {
    position: absolute;
    left: 0;
    top: 68%;
    width: 100%;
    height: 31%;
    display: flex;
    gap: 2%;
    padding: 0 1.5%;
  }
  .battle-bottom > * { min-width: 0; }
  .message-box {
    flex: 0 0 60%;
    background: var(--paper);
    border: 3px solid var(--gb-darkest);
    border-radius: 6px;
    padding: 3% 4%;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
  }
  .message-box.hidden { display: none; }
  #msgLabel {
    font-size: clamp(0.52rem, 1.9vw, 0.76rem);
    line-height: 1.35;
  }
  #msgIndicator {
    position: absolute;
    right: 6%;
    bottom: 6%;
    font-size: 0.8em;
    animation: blink 0.8s steps(1) infinite;
  }
  #msgIndicator.hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { #msgIndicator { animation: none; } }

  .menu-grid, .move-menu {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3%;
    align-content: center;
  }
  .move-menu { grid-template-rows: 1fr 1fr auto; }
  .move-menu .menu-btn:nth-child(3),
  .move-menu .menu-btn:nth-child(4) { grid-row: 2; }
  #btnMoveBack { grid-column: 1 / -1; grid-row: 3; }
  .menu-grid.hidden, .move-menu.hidden { display: none; }
  .menu-btn {
    font-family: inherit;
    font-size: clamp(0.5rem, 1.7vw, 0.68rem);
    letter-spacing: 0.03em;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 4px;
    color: var(--gb-darkest);
    cursor: pointer;
    touch-action: manipulation;
    min-width: 0;
    padding: 0.2em 0.3em;
    overflow-wrap: anywhere;
  }
  .menu-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .menu-btn:active:not(:disabled) { transform: translateY(1px); }

  /* ---------- Exploração (mapa) ---------- */
  #view-explore { inset: 0; }
  .explore-status {
    display: flex;
    align-items: center;
    gap: 3%;
    padding: 2% 4%;
    background: var(--paper);
    border-bottom: 2px solid var(--gb-darkest);
    font-size: clamp(0.5rem, 1.7vw, 0.7rem);
    flex: none;
  }
  .explore-status__bar { flex: 1; height: 10px; margin: 0; }
  #exploreHpNumeric { font-variant-numeric: tabular-nums; }

  .map-viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--gb-dark);
  }
  .map-grid {
    display: grid;
    grid-template-columns: repeat(var(--map-cols), 1fr);
    grid-template-rows: repeat(var(--map-rows), 1fr);
    width: 100%;
    height: 100%;
  }
  .map-tile.tile-path { background: var(--gb-lightest); }
  .map-tile.tile-grass {
    background:
      repeating-linear-gradient(115deg, transparent 0 40%, rgba(15, 56, 15, 0.25) 40% 55%, transparent 55% 100%),
      var(--gb-light);
  }
  .map-tile.tile-tree { background: var(--gb-darkest); }

  .player-token, .npc-token {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.12s linear, top 0.12s linear;
    pointer-events: none;
  }
  .player-token {
    z-index: 2;
    font-size: clamp(0.6rem, 2.6vw, 0.95rem);
  }
  .player-token__dot {
    width: 62%;
    height: 62%;
    border-radius: 50%;
    background: var(--led-red);
    border: 1.5px solid var(--gb-darkest);
    box-shadow: 0 0 0 2px var(--gb-lightest);
  }
  .npc-token { z-index: 1; }

  /* Treinadores: ícone em pixel art (silhueta genérica de pessoa,
     desenhada à mão pra esta demo) tingido com a cor de cada treinador —
     não é retrato de ninguém, só uma forma simples pra diferenciar um
     treinador do outro à primeira vista. */
  .npc-trainer-badge {
    width: 78%;
    height: 78%;
    image-rendering: pixelated;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
  }

  /* Ginásio/Centro: ícone de prédio em pixel art (também desenhado à mão)
     + etiqueta de texto, pra não depender só do desenho. */
  .npc-building-icon {
    width: 88%;
    height: 88%;
    image-rendering: pixelated;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
  }
  .npc-label {
    position: absolute;
    bottom: -34%;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(0.32rem, 1.3vw, 0.46rem);
    letter-spacing: 0.02em;
    white-space: nowrap;
    background: var(--paper);
    color: var(--gb-darkest);
    padding: 0 3px;
    border: 1px solid var(--gb-darkest);
    border-radius: 2px;
    z-index: 5;
  }

  .explore-exit {
    position: absolute;
    top: 2%;
    right: 2%;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--gb-darkest);
    background: var(--paper);
    color: var(--gb-darkest);
    font-size: 0.7rem;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 3;
  }

  .explore-dpad {
    position: absolute;
    right: 4%;
    bottom: 4%;
    width: 96px;
    height: 96px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    opacity: 0.85;
    z-index: 3;
  }
  .dpad-btn {
    font-size: 0.8rem;
    border: 2px solid var(--gb-darkest);
    background: var(--paper);
    color: var(--gb-darkest);
    cursor: pointer;
    touch-action: manipulation;
    padding: 0;
  }
  .dpad-btn--up { grid-column: 2; grid-row: 1; }
  .dpad-btn--left { grid-column: 1; grid-row: 2; }
  .dpad-btn--right { grid-column: 3; grid-row: 2; }
  .dpad-btn--down { grid-column: 2; grid-row: 3; }

  #view-explore .message-box {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: 4%;
    z-index: 4;
  }

  /* ---------- Decorative controls ---------- */
  .console__controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 0.4rem 0.2rem;
  }
  .dpad { position: relative; width: 78px; height: 78px; flex: none; }
  .dpad span {
    position: absolute;
    background: linear-gradient(160deg, #2b2a38, #17161f);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
  }
  .dpad__up, .dpad__down { left: 29px; width: 20px; height: 78px; border-radius: 3px; }
  .dpad__left, .dpad__right { top: 29px; width: 78px; height: 20px; border-radius: 3px; }
  .dpad__center {
    left: 29px; top: 29px; width: 20px; height: 20px;
    background: #17161f; border-radius: 2px;
  }
  .ab-buttons { display: flex; align-items: flex-end; gap: 10px; transform: rotate(-18deg); }
  .btn-a, .btn-b {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; color: var(--shell-shadow);
    background: linear-gradient(160deg, #8c8ba0, var(--shell-lo));
    box-shadow: 0 3px 0 var(--shell-shadow), 0 4px 6px rgba(0, 0, 0, 0.3);
  }
  .btn-a { margin-bottom: 10px; }

  .console__meta {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    padding: 0.6rem 0 0.4rem;
  }
  .pill-btn {
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--shell-shadow);
    background: linear-gradient(160deg, #8c8ba0, var(--shell-lo));
    border: none;
    border-radius: 8px;
    min-width: 64px;
    min-height: 40px;
    padding: 0.5em 1em;
    box-shadow: 0 2px 0 var(--shell-shadow);
    cursor: pointer;
    touch-action: manipulation;
  }
  .pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pill-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }

  .console__speaker {
    position: absolute;
    right: clamp(0.8rem, 2.4vw, 1.7rem);
    bottom: 0.9rem;
    width: 46px;
    height: 30px;
    background:
      repeating-linear-gradient(-35deg, var(--shell-shadow) 0 3px, transparent 3px 8px);
    opacity: 0.6;
  }

  button { font: inherit; }
  button:focus-visible, .starter-card:focus-visible, .message-box:focus-visible {
    outline: 2px solid var(--led-red);
    outline-offset: 2px;
  }

  @media (max-width: 480px), (max-height: 520px) {
    /* START/SELECT são só um mimetismo decorativo do hardware — em telas
       pequenas, tirá-los da frente dá mais espaço à tela do jogo em si, que
       já cobre a mesma função (botão JOGAR + toque na caixa de mensagem). */
    .console__controls, .console__speaker, .console__meta { display: none; }
    .console {
      width: min(96vw, 720px, max(220px, calc((100vh - 9.5rem) * 1.55)));
      padding-top: 0.5rem;
    }
    .console__top { padding-bottom: 0.3rem; }
    .page { gap: 0.4rem; padding: 0.4rem; }
    .page__hint { font-size: 0.6rem; }

    /* Menus em coluna única: com o ecrã comprimido, um grid 2x2 espreme
       demais o texto dos botões (ex.: "Chicote de Vinha"). Uma lista
       vertical dá a cada botão a largura toda da área de menu. */
    .menu-grid, .move-menu {
      grid-template-columns: 1fr;
      grid-template-rows: none;
    }
    .move-menu .menu-btn:nth-child(3),
    .move-menu .menu-btn:nth-child(4),
    #btnMoveBack {
      grid-column: auto;
      grid-row: auto;
    }
    .menu-grid, .move-menu { gap: 1%; }
    .menu-btn {
      font-size: clamp(0.4rem, 1.6vw, 0.58rem);
      line-height: 1.05;
      padding: 0.08em 0.3em;
    }

    /* Rouba espaço da área de sprites para dar mais altura ao menu,
       que agora empilha em coluna única e precisa de mais linhas. */
    #enemySprite { height: 28%; }
    #enemyPanel { height: 22%; }
    #playerSprite { top: 32%; height: 24%; }
    #playerPanel { top: 32%; height: 27%; padding: 1% 4%; }
    .hp-numeric { margin-top: 0; }
    .battle-bottom { top: 61%; height: 38%; }
  }
</style>

<noscript>
  <div style="max-width:420px;margin:15vh auto;padding:1.5rem;border:3px solid #0f380f;
    border-radius:8px;background:#9bbc0f;color:#0f380f;font-family:monospace;
    text-align:center;">
    Este jogo precisa de JavaScript para funcionar, e ele está desativado (ou
    bloqueado) neste navegador/visualizador. Se você abriu o arquivo tocando
    nele direto no celular, tente abri-lo explicitamente num navegador
    (Chrome/Safari) em vez da pré-visualização rápida de arquivos — ou use o
    link do artifact, que já abre dentro de um navegador completo.
  </div>
</noscript>

<div class="page">
  <div class="console">
    <div class="console__top">
      <span class="console__led" aria-hidden="true"></span>
      <span class="console__brand">POCKET BATTLE</span>
    </div>

    <div class="console__screen-frame">

  function spriteFor(sp) {
    return SPRITE_DATA_URIS[sp.id];
  }

  // ---------- Modelo de batalha (Ataque vs Defesa, ordem por Velocidade) ----------
  function BattlePokemon(species, level) {
    this.species = species;
    this.level = level;
    this.maxHp = Math.floor((2 * species.hp * level) / 100) + level + 10;
    this.atk = Math.floor((2 * species.atk * level) / 100) + 5;
    this.def = Math.floor((2 * species.def * level) / 100) + 5;
    this.spd = Math.floor((2 * species.spd * level) / 100) + 5;
    this.hp = this.maxHp;
    this.moves = [BASE_MOVE, species.move];
  }
  BattlePokemon.prototype.isFainted = function () { return this.hp <= 0; };
  BattlePokemon.prototype.takeDamage = function (n) { this.hp = Math.max(0, this.hp - n); };
  BattlePokemon.prototype.hpRatio = function () { return this.maxHp <= 0 ? 0 : this.hp / this.maxHp; };
  BattlePokemon.prototype.healFull = function () { this.hp = this.maxHp; };

  // Fórmula SIMPLES pedida: dano ~ (Ataque / Defesa) * Poder do golpe, com
  // variação aleatória de 85%-100% (igual ao "roll" de dano dos jogos).
  function calculateDamage(attacker, defender, move) {
    var ratio = attacker.atk / Math.max(1, defender.def);
    var raw = ratio * move.power * 0.5;
    var randomFactor = 0.85 + Math.random() * 0.15;
    return Math.max(1, Math.round(raw * randomFactor));
  }

  function hpColor(ratio) {
    if (ratio > 0.5) return "var(--hp-green)";
    if (ratio > 0.2) return "var(--hp-yellow)";
    return "var(--hp-red)";
  }

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var views = {
    title: $("view-title"), select: $("view-select"),
    battle: $("view-battle"), explore: $("view-explore"),
  };
  function showView(name) {
    Object.keys(views).forEach(function (k) { views[k].classList.toggle("hidden", k !== name); });
  }

  var regionListEl = $("regionList");
  var starterGridEl = $("starterGrid");
  var detailPanel = $("detailPanel");
  var detailSprite = $("detailSprite");
  var detailName = $("detailName");
  var detailStats = $("detailStats");

  var pendingSpecies = null;

  function buildRegionTabs() {
    REGIONS.forEach(function (region) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "region-btn";
      btn.textContent = region;
      btn.addEventListener("click", function () { selectRegion(region, btn); });
      regionListEl.appendChild(btn);
    });
  }

  function selectRegion(region, btnEl) {
    Array.prototype.forEach.call(regionListEl.children, function (c) { c.classList.remove("active"); });
    if (btnEl) btnEl.classList.add("active");
    starterGridEl.innerHTML = "";
    SPECIES.filter(function (s) { return s.region === region; }).forEach(function (sp) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "starter-card";
      var img = document.createElement("img");
      img.src = spriteFor(sp);
      img.alt = sp.name;
      var label = document.createElement("span");
      label.textContent = sp.name;
      card.appendChild(img);
      card.appendChild(label);
      card.addEventListener("click", function () { showDetail(sp); });
      starterGridEl.appendChild(card);
    });
  }

  function showDetail(sp) {
    pendingSpecies = sp;
    detailSprite.src = spriteFor(sp);
    detailSprite.alt = sp.name;
    detailName.textContent = sp.name + " (" + sp.region + ")";
    detailStats.textContent = "Tipo: " + typeLabel(sp) +
      "\nHP " + sp.hp + "   ATK " + sp.atk + "   DEF " + sp.def + "   VEL " + sp.spd;
    detailPanel.classList.remove("hidden");
  }

  $("btnConfirmStarter").addEventListener("click", function () {
    if (!pendingSpecies) return;
    detailPanel.classList.add("hidden");
    startGame(pendingSpecies);
  });
  $("btnCancelStarter").addEventListener("click", function () {
    pendingSpecies = null;
    detailPanel.classList.add("hidden");
  });

  $("btnPlay").addEventListener("click", function () { showView("select"); });

  // ---------- Batalha ----------
  var enemySprite = $("enemySprite"), playerSprite = $("playerSprite");
  var enemyName = $("enemyName"), enemyLevel = $("enemyLevel"), enemyHpFill = $("enemyHpFill");
  var playerName = $("playerName"), playerLevel = $("playerLevel"), playerHpFill = $("playerHpFill"), playerHpNumeric = $("playerHpNumeric");
  var messageBox = $("messageBox"), msgLabel = $("msgLabel"), msgIndicator = $("msgIndicator");
  var actionMenu = $("actionMenu"), moveMenu = $("moveMenu"), moveBackBtn = $("btnMoveBack");
  var btnFight = $("btnFight"), btnRun = $("btnRun");
  var btnStart = $("btnStart");

  var ackResolve = null;
  function showMessage(text) {
    msgLabel.textContent = text;
    msgIndicator.classList.remove("hidden");
    hideMenus();
    return new Promise(function (resolve) { ackResolve = resolve; });
  }
  function acknowledge() {
    if (ackResolve) {
      var r = ackResolve; ackResolve = null;
      msgIndicator.classList.add("hidden");
      r();
    }
  }
  messageBox.addEventListener("click", acknowledge);
  messageBox.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") acknowledge(); });

  function hideMenus() { actionMenu.classList.add("hidden"); moveMenu.classList.add("hidden"); }

  function updateHpUi(bp, isPlayer) {
    var ratio = bp.hpRatio();
    var fill = isPlayer ? playerHpFill : enemyHpFill;
    fill.style.width = (ratio * 100) + "%";
    fill.style.background = hpColor(ratio);
    if (isPlayer) playerHpNumeric.textContent = bp.hp + "/" + bp.maxHp;
  }

  function setupBattleUi(playerBp, enemyBp) {
    enemySprite.src = spriteFor(enemyBp.species);
    enemyName.textContent = enemyBp.species.name;
    enemyLevel.textContent = "Nv" + enemyBp.level;
    updateHpUi(enemyBp, false);

    playerSprite.src = spriteFor(playerBp.species);
    playerName.textContent = playerBp.species.name;
    playerLevel.textContent = "Nv" + playerBp.level;
    updateHpUi(playerBp, true);

    moveMenu.innerHTML = "";
    playerBp.moves.forEach(function (mv) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "menu-btn";
      b.textContent = mv.name + " (" + mv.type + ")";
      moveMenu.appendChild(b);
    });
    moveMenu.appendChild(moveBackBtn);
  }

  function waitForPlayerAction(playerBp) {
    return new Promise(function (resolve) {
      hideMenus();
      actionMenu.classList.remove("hidden");
      msgLabel.textContent = "O que " + playerBp.species.name + " fará?";

      btnFight.onclick = function () {
        actionMenu.classList.add("hidden");
        moveMenu.classList.remove("hidden");
        var moveButtons = moveMenu.querySelectorAll(".menu-btn:not(#btnMoveBack)");
        moveButtons.forEach(function (btn, idx) {
          btn.onclick = function () { resolve({ type: "move", move: playerBp.moves[idx] }); };
        });
        moveBackBtn.onclick = function () {
          moveMenu.classList.add("hidden");
          actionMenu.classList.remove("hidden");
        };
      };
      btnRun.onclick = btnRun.disabled ? null : function () { hideMenus(); resolve({ type: "run" }); };
    });
  }

  async function executeMove(attacker, defender, move, attackerIsPlayer) {
    await showMessage(attacker.species.name + " usou " + move.name + "!");
    if (Math.random() * 100 > move.accuracy) {
      await showMessage("O ataque errou!");
      return;
    }
    var damage = calculateDamage(attacker, defender, move);
    defender.takeDamage(damage);
    updateHpUi(defender, !attackerIsPlayer);
    await showMessage("Causou " + damage + " de dano em " + defender.species.name + "!");
  }

  // Roda uma batalha completa e resolve com "win" | "lose" | "run". Não
  // decide o que acontece depois (voltar ao mapa, curar, etc.) — isso é
  // responsabilidade de quem chamou (exploração), mantendo a batalha
  // reutilizável tanto para encontros selvagens quanto contra treinadores.
  async function runBattle(playerBp, enemyBp, opts) {
    opts = opts || {};
    var allowRun = opts.allowRun !== false;

    showView("battle");
    setupBattleUi(playerBp, enemyBp);
    btnRun.disabled = !allowRun;

    var introLine = opts.introText ||
      ("Um " + enemyBp.species.name + " selvagem apareceu!");
    await showMessage(introLine);
    await showMessage("Vai, " + playerBp.species.name + "!");

    while (true) {
      var action = await waitForPlayerAction(playerBp);
      if (action.type === "run") {
        await showMessage("Você fugiu da batalha com segurança!");
        return "run";
      }

      var playerMove = action.move;
      var enemyMove = enemyBp.moves[Math.floor(Math.random() * enemyBp.moves.length)];
      var playerFirst = playerBp.spd >= enemyBp.spd;
      var order = playerFirst
        ? [[playerBp, enemyBp, playerMove, true], [enemyBp, playerBp, enemyMove, false]]
        : [[enemyBp, playerBp, enemyMove, false], [playerBp, enemyBp, playerMove, true]];

      for (var i = 0; i < order.length; i++) {
        var turn = order[i];
        await executeMove(turn[0], turn[1], turn[2], turn[3]);
        var def = turn[1];
        if (def.isFainted()) {
          var defIsEnemy = turn[3] === true;
          await showMessage(def.species.name + (defIsEnemy ? " inimigo" : "") + " desmaiou!");
          return defIsEnemy ? "win" : "lose";
        }
      }
    }
  }

  btnStart.addEventListener("click", function () {
    if (!views.title.classList.contains("hidden")) { showView("select"); return; }
    acknowledge();
  });

  // ---------- Exploração (mapa original, sem nenhum dado extraído de jogo) ----------
  // Ícones em pixel art desenhados à mão para esta demo (silhueta genérica
  // de pessoa, silhueta genérica de casa com emblema) — não são sprite de
  // nenhum personagem nem prédio extraído de jogo nenhum, só formas
  // simples rasterizadas num grid pequeno pra combinar com o resto do
  // visual "Game Boy" pixelado.
  var PATTERN_PERSON = [
    "............",
    "....BBBB....",
    "....BBBB....",
    "....BBBB....",
    "....BBBB....",
    "............",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    ".BBBBBBBBBB.",
    "............",
  ];
  var PATTERN_BUILDING_CROSS = [
    "..............",
    "......RR......",
    ".....RRRR.....",
    "....RRRRRR....",
    "...RRRRRRRR...",
    "..RRRRRRRRRR..",
    ".RRRRRRRRRRRR.",
    ".WWWWWWWWWWWW.",
    ".WWWWWXXWWWWW.",
    ".WWWWWXXWWWWW.",
    ".WWWXXXXXXWWW.",
    ".WWWWWXXWWWWW.",
    ".WWWWWWWWWWWW.",
    "..............",
  ];
  var PATTERN_BUILDING_STAR = [
    "..............",
    "......RR......",
    ".....RRRR.....",
    "....RRRRRR....",
    "...RRRRRRRR...",
    "..RRRRRRRRRR..",
    ".RRRRRRRRRRRR.",
    ".WWWWWWWWWWWW.",
    ".WWWWWXXWWWWW.",
    ".WWWWXXXXWWWW.",
    ".WWWWXXXXWWWW.",
    ".WWWWWXXWWWWW.",
    ".WWWWWWWWWWWW.",
    "..............",
  ];

  function drawPixelIcon(pattern, colors) {
    var h = pattern.length, w = pattern[0].length;
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext("2d");
    var filled = pattern.map(function (row) {
      return row.split("").map(function (c) { return c !== "."; });
    });
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        if (!filled[y][x]) continue;
        ctx.fillStyle = colors[pattern[y][x]];
        ctx.fillRect(x, y, 1, 1);
      }
    }
    for (var yy = 0; yy < h; yy++) {
      for (var xx = 0; xx < w; xx++) {
        if (filled[yy][xx]) continue;
        var hasNeighbor =
          (xx > 0 && filled[yy][xx - 1]) || (xx < w - 1 && filled[yy][xx + 1]) ||
          (yy > 0 && filled[yy - 1][xx]) || (yy < h - 1 && filled[yy + 1][xx]);
        if (hasNeighbor) { ctx.fillStyle = colors["*"]; ctx.fillRect(xx, yy, 1, 1); }
      }
    }
    return canvas.toDataURL();
  }

  var iconCache = {};
  function trainerIconUrl(color) {
    var key = "person:" + color;
    if (!iconCache[key]) iconCache[key] = drawPixelIcon(PATTERN_PERSON, { B: color, "*": "#0f380f" });
    return iconCache[key];
  }
  function buildingIconUrl(kind) {
    var key = "building:" + kind;
    if (!iconCache[key]) {
      var pattern = kind === "center" ? PATTERN_BUILDING_CROSS : PATTERN_BUILDING_STAR;
      var badgeColor = kind === "center" ? "#d1372f" : "#f8d030";
      iconCache[key] = drawPixelIcon(pattern, { R: "#0f380f", W: "#eef0e2", X: badgeColor, "*": "#0f380f" });
    }
    return iconCache[key];
  }

  var MAP_COLS = 9;
  var MAP_ROWS = 7;
  var MAP_TERRAIN = [
    "#########",
    "#.......#",
    "#...,,..#",
    "#...,,..#",
    "#.......#",
    "#.......#",
    "#########",
  ];

  // speciesId/level fixos por NPC — mesmo treinador sempre tem o mesmo time,
  // como nos jogos oficiais. Nomes e falas são originais desta demo.
  var NPCS = [
    {
      id: "center", x: 2, y: 2, kind: "center", name: "Centro Pokémon",
      lines: ["Enfermeira: Bem-vindo! Vou cuidar do seu Pokémon.", "Pronto! Ele está em plena forma de novo."],
    },
    {
      id: "gym", x: 6, y: 2, kind: "gym", name: "Líder Marco", speciesId: 9, level: 11, defeated: false,
      introLines: ["Líder Marco: Então você chegou até o Ginásio...", "Vamos ver se você tem o que é preciso!"],
      winLines: ["Líder Marco: Impressionante! Você merece isso.", "Você conquistou a Insígnia Pioneira!"],
      loseLines: ["Líder Marco: Volte quando seu time estiver mais forte."],
      againLines: ["Líder Marco: Continue treinando forte por aí."],
    },
    {
      id: "trainer1", x: 2, y: 4, kind: "trainer", name: "Treinador Davi", speciesId: 2, level: 7, defeated: false,
      shortLabel: "D", color: "#e6664d",
      introLines: ["Treinador Davi: Ei! Vamos ver do que seu Pokémon é capaz!"],
      winLines: ["Treinador Davi: Nossa, fui superado..."],
      loseLines: ["Treinador Davi: Ainda bem que treino bastante!"],
      againLines: ["Treinador Davi: Foi uma boa batalha, hein?"],
    },
    {
      id: "trainer2", x: 6, y: 4, kind: "trainer", name: "Treinadora Ana", speciesId: 21, level: 8, defeated: false,
      shortLabel: "A", color: "#4d99d9",
      introLines: ["Treinadora Ana: Não vou facilitar!"],
      winLines: ["Treinadora Ana: Você é forte mesmo!"],
      loseLines: ["Treinadora Ana: Treine mais um pouco!"],
      againLines: ["Treinadora Ana: Continue assim!"],
    },
  ];

  var explore = { playerBp: null, x: 4, y: 5, locked: false };

  var mapGrid = $("mapGrid"), mapViewport = $("mapViewport"), playerToken = $("playerToken");
  var exploreName = $("exploreName"), exploreLevel = $("exploreLevel");
  var exploreHpFill = $("exploreHpFill"), exploreHpNumeric = $("exploreHpNumeric");
  var exploreMessageBox = $("exploreMessageBox"), exploreMsgLabel = $("exploreMsgLabel"), exploreMsgIndicator = $("exploreMsgIndicator");

  var exploreAckResolve = null;
  function showExploreMessage(text) {
    exploreMsgLabel.textContent = text;
    exploreMessageBox.classList.remove("hidden");
    exploreMsgIndicator.classList.remove("hidden");
    return new Promise(function (resolve) { exploreAckResolve = resolve; });
  }
  function acknowledgeExplore() {
    if (exploreAckResolve) {
      var r = exploreAckResolve; exploreAckResolve = null;
      exploreMessageBox.classList.add("hidden");
      exploreMsgIndicator.classList.add("hidden");
      r();
    }
  }
  async function showExploreMessages(lines) {
    for (var i = 0; i < lines.length; i++) await showExploreMessage(lines[i]);
  }
  exploreMessageBox.addEventListener("click", acknowledgeExplore);
  exploreMessageBox.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") acknowledgeExplore(); });

  function buildMap() {
    mapGrid.style.setProperty("--map-cols", MAP_COLS);
    mapGrid.style.setProperty("--map-rows", MAP_ROWS);
    mapGrid.innerHTML = "";
    for (var y = 0; y < MAP_ROWS; y++) {
      for (var x = 0; x < MAP_COLS; x++) {
        var ch = MAP_TERRAIN[y][x];
        var cell = document.createElement("div");
        cell.className = "map-tile " + (ch === "#" ? "tile-tree" : ch === "," ? "tile-grass" : "tile-path");
        mapGrid.appendChild(cell);
      }
    }
    mapViewport.querySelectorAll(".npc-token").forEach(function (el) { el.remove(); });
    NPCS.forEach(function (npc) {
      var token = document.createElement("div");
      token.className = "npc-token npc-" + npc.kind;
      positionToken(token, npc.x, npc.y);

      if (npc.kind === "trainer") {
        var badge = document.createElement("img");
        badge.className = "npc-trainer-badge";
        badge.src = trainerIconUrl(npc.color);
        badge.alt = npc.name;
        token.appendChild(badge);
      } else {
        var icon = document.createElement("img");
        icon.className = "npc-building-icon";
        icon.src = buildingIconUrl(npc.kind);
        icon.alt = npc.kind === "center" ? "Centro Pokémon" : "Ginásio";
        token.appendChild(icon);

        var label = document.createElement("span");
        label.className = "npc-label";
        label.textContent = npc.kind === "center" ? "CENTRO" : "GINÁSIO";
        token.appendChild(label);
      }

      mapViewport.appendChild(token);
    });
  }

  function positionToken(el, x, y) {
    el.style.left = ((x / MAP_COLS) * 100) + "%";
    el.style.top = ((y / MAP_ROWS) * 100) + "%";
    el.style.width = ((1 / MAP_COLS) * 100) + "%";
    el.style.height = ((1 / MAP_ROWS) * 100) + "%";
  }

  function updateExploreStatus() {
    var bp = explore.playerBp;
    exploreName.textContent = bp.species.name;
    exploreLevel.textContent = "Nv" + bp.level;
    var ratio = bp.hpRatio();
    exploreHpFill.style.width = (ratio * 100) + "%";
    exploreHpFill.style.background = hpColor(ratio);
    exploreHpNumeric.textContent = bp.hp + "/" + bp.maxHp;
  }

  function isBlockedTile(x, y) {
    if (x < 0 || y < 0 || x >= MAP_COLS || y >= MAP_ROWS) return true;
    return MAP_TERRAIN[y][x] === "#";
  }
  function npcAt(x, y) {
    for (var i = 0; i < NPCS.length; i++) if (NPCS[i].x === x && NPCS[i].y === y) return NPCS[i];
    return null;
  }

  // Tile aberto logo à frente da porta do Centro Pokémon — é para onde o
  // jogador "acorda" depois de desmaiar, igual ao blackout dos jogos oficiais.
  var CENTER_RESPAWN = { x: 2, y: 3 };

  function sendToCenter() {
    explore.playerBp.healFull();
    updateExploreStatus();
    explore.x = CENTER_RESPAWN.x;
    explore.y = CENTER_RESPAWN.y;
    positionToken(playerToken, explore.x, explore.y);
  }

  async function interactWithNpc(npc) {
    explore.locked = true;
    if (npc.kind === "center") {
      await showExploreMessages(npc.lines);
      explore.playerBp.healFull();
      updateExploreStatus();
    } else {
      if (npc.defeated) {
        await showExploreMessages(npc.againLines);
      } else {
        await showExploreMessages(npc.introLines);
        var enemySpecies = SPECIES.filter(function (s) { return s.id === npc.speciesId; })[0];
        var enemyBp = new BattlePokemon(enemySpecies, npc.level);
        var result = await runBattle(explore.playerBp, enemyBp, {
          allowRun: false,
          introText: npc.name + " chamou " + enemyBp.species.name + " para batalhar!",
        });
        showView("explore");
        if (result === "win") {
          npc.defeated = true;
          await showExploreMessages(npc.winLines);
        } else if (result === "lose") {
          await showExploreMessages(npc.loseLines);
          sendToCenter();
          await showExploreMessage("Você foi levado ao Centro Pokémon mais próximo.");
        }
      }
    }
    explore.locked = false;
  }

  function pickRandomOpponent(excludeId) {
    var candidates = SPECIES.filter(function (s) { return s.id !== excludeId; });
    if (candidates.length === 0) candidates = SPECIES;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  async function maybeWildEncounter() {
    if (Math.random() >= 0.22) return;
    explore.locked = true;
    var enemySpecies = pickRandomOpponent(explore.playerBp.species.id);
    var enemyLevel = Math.max(2, 5 + Math.floor(Math.random() * 4) - 1);
    var enemyBp = new BattlePokemon(enemySpecies, enemyLevel);
    var result = await runBattle(explore.playerBp, enemyBp, { allowRun: true });
    showView("explore");
    if (result === "lose") {
      sendToCenter();
      await showExploreMessage("Você foi levado ao Centro Pokémon mais próximo.");
    }
    explore.locked = false;
  }

  async function tryMove(dx, dy) {
    if (explore.locked) return;
    var nx = explore.x + dx, ny = explore.y + dy;
    if (isBlockedTile(nx, ny)) return;
    var npc = npcAt(nx, ny);
    if (npc) { await interactWithNpc(npc); return; }
    explore.x = nx; explore.y = ny;
    positionToken(playerToken, explore.x, explore.y);
    if (MAP_TERRAIN[ny][nx] === ",") await maybeWildEncounter();
  }

  ["dpadUp", "dpadDown", "dpadLeft", "dpadRight"].forEach(function (id) {
    var dx = id === "dpadLeft" ? -1 : id === "dpadRight" ? 1 : 0;
    var dy = id === "dpadUp" ? -1 : id === "dpadDown" ? 1 : 0;
    $(id).addEventListener("click", function () { tryMove(dx, dy); });
  });

  window.addEventListener("keydown", function (e) {
    if (views.explore.classList.contains("hidden")) return;
    var map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
    var move = map[e.key];
    if (move) { e.preventDefault(); tryMove(move[0], move[1]); }
  });

  $("btnExploreExit").addEventListener("click", function () { showView("title"); });

  function enterExploration(species) {
    explore.playerBp = new BattlePokemon(species, 5);
    explore.x = 4; explore.y = 5; explore.locked = false;
    positionToken(playerToken, explore.x, explore.y);
    updateExploreStatus();
    showView("explore");
  }

  function startGame(species) {
    enterExploration(species);
  }

  // ---------- Boot ----------
  buildRegionTabs();
  selectRegion(REGIONS[0], regionListEl.children[0]);
  buildMap();
  showView("title");
})();
</script>
</body>
</html>
