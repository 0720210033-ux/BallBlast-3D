<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#57566b">
<meta name="description" content="Demo jogável de um sistema de batalha por turnos estilo Pokémon FireRed, visual Game Boy.">
<title>Pocket Battle — Demo Jogável</title>
</head>
<body>
<style>
  :root {
    --gb-lightest: #9bbc0f;
    --gb-light: #8bac0f;
    --gb-dark: #306230;
    --gb-darkest: #0f380f;
    --shell: #86859c;
    --shell-hi: #9796ac;
    --shell-lo: #57566b;
    --shell-shadow: #38374a;
    --led-red: #d1372f;
    --led-red-dim: #6e2320;
    --paper: #eef0e2;
    --page-bg-light: #d8d5c8;
    --page-bg-dark: #131219;
    --hp-green: #58d068;
    --hp-yellow: #f8d030;
    --hp-red: #f83030;
    --font-mono: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
  }
  :root { --page-bg: var(--page-bg-light); }
  @media (prefers-color-scheme: dark) { :root { --page-bg: var(--page-bg-dark); } }
  :root[data-theme="dark"] { --page-bg: var(--page-bg-dark); }
  :root[data-theme="light"] { --page-bg: var(--page-bg-light); }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    font-family: var(--font-mono);
    color: var(--gb-darkest);
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    padding: clamp(0.5rem, 3vw, 2rem);
  }

  .page__hint {
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--page-bg) 30%, var(--gb-darkest) 70%);
    opacity: 0.65;
    text-align: center;
  }

  .console {
    width: min(96vw, 720px);
    background: linear-gradient(160deg, var(--shell-hi), var(--shell) 55%, var(--shell-lo));
    border-radius: 22px;
    padding: clamp(0.7rem, 2vw, 1.4rem) clamp(0.8rem, 2.4vw, 1.7rem) 1.1rem;
    box-shadow:
      0 2px 0 var(--shell-hi) inset,
      0 -6px 14px var(--shell-shadow) inset,
      0 18px 34px rgba(0, 0, 0, 0.35);
    position: relative;
  }

  .console__top {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0.2rem 0.6rem;
  }
  .console__led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8b83, var(--led-red) 60%, var(--led-red-dim));
    box-shadow: 0 0 6px var(--led-red);
    flex: none;
  }
  .console__brand {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--shell-shadow);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .console__screen-frame {
    background: linear-gradient(150deg, var(--shell-lo), var(--shell-shadow));
    border-radius: 10px;
    padding: clamp(0.6rem, 2.4vw, 1.1rem);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4) inset;
  }

  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    background: var(--gb-lightest);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--gb-darkest) inset;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(15, 56, 15, 0.07) 0px,
      rgba(15, 56, 15, 0.07) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  .view.hidden { display: none; }

  /* ---------- Title view ---------- */
  #view-title {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0.7em;
    padding: 6%;
  }
  .title-heading {
    margin: 0;
    font-size: clamp(1rem, 5.4vw, 1.6rem);
    line-height: 1.15;
    letter-spacing: 0.03em;
    color: var(--gb-darkest);
    text-wrap: balance;
  }
  .title-sub {
    margin: 0;
    font-size: clamp(0.6rem, 2vw, 0.78rem);
    color: var(--gb-dark);
    letter-spacing: 0.04em;
  }
  .title-blink {
    margin-top: 0.6em;
    font-size: clamp(0.6rem, 2vw, 0.75rem);
    letter-spacing: 0.08em;
    color: var(--gb-darkest);
    animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .title-blink { animation: none; opacity: 1; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  .btn-play {
    margin-top: 0.4em;
    font-family: inherit;
    font-size: clamp(0.72rem, 2.4vw, 0.9rem);
    letter-spacing: 0.08em;
    padding: 0.7em 1.6em;
    background: var(--gb-darkest);
    color: var(--gb-lightest);
    border: 2px solid var(--gb-darkest);
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-play:active { transform: translateY(1px); }

  /* ---------- Starter select view ---------- */
  #view-select { padding: 4% 4% 3%; gap: 2%; }
  .select-title {
    margin: 0 0 1%;
    font-size: clamp(0.62rem, 2.2vw, 0.85rem);
    letter-spacing: 0.06em;
    text-align: center;
    color: var(--gb-darkest);
  }
  .select-body {
    flex: 1;
    display: flex;
    gap: 3%;
    min-height: 0;
  }
  .region-list {
    flex: 0 0 26%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4%;
    overflow-y: auto;
    background: color-mix(in srgb, var(--gb-dark) 30%, transparent);
    border-radius: 6px;
    padding: 3%;
  }
  .region-btn {
    font-family: inherit;
    font-size: clamp(0.5rem, 1.7vw, 0.68rem);
    letter-spacing: 0.03em;
    padding: 0.5em 0.3em;
    border: 1px solid var(--gb-darkest);
    border-radius: 3px;
    background: var(--paper);
    color: var(--gb-darkest);
    cursor: pointer;
    touch-action: manipulation;
  }
  .region-btn.active {
    background: var(--gb-darkest);
    color: var(--gb-lightest);
  }
  .starter-scroll {
    flex: 1;
    min-width: 0;
    overflow-x: hidden;
    overflow-y: auto;
    background: color-mix(in srgb, var(--gb-dark) 30%, transparent);
    border-radius: 6px;
    padding: 3%;
  }
  .starter-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4%;
  }
  .starter-card {
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    gap: 0.3em;
    background: var(--paper);
    border: 1px solid var(--gb-darkest);
    border-radius: 5px;
    padding: 0.4em 0.2em 0.5em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .starter-card img {
    width: 60%;
    aspect-ratio: 1;
    image-rendering: pixelated;
  }
  .starter-card span {
    width: 100%;
    min-width: 0;
    font-size: clamp(0.44rem, 1.5vw, 0.62rem);
    letter-spacing: 0.02em;
    text-align: center;
    overflow-wrap: break-word;
    color: var(--gb-darkest);
  }
  .detail-panel {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 3%;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 6px;
    padding: 2.5%;
    margin-top: 2%;
  }
  .detail-panel.hidden { display: none; }
  .detail-panel img { width: clamp(38px, 10vw, 60px); aspect-ratio: 1; image-rendering: pixelated; flex: none; }
  .detail-info { flex: 1; min-width: 0; }
  .detail-info h3 {
    margin: 0 0 0.2em;
    font-size: clamp(0.6rem, 2vw, 0.78rem);
  }
  .detail-info p {
    margin: 0;
    font-size: clamp(0.48rem, 1.6vw, 0.62rem);
    white-space: pre-line;
    color: var(--gb-dark);
  }
  .detail-actions { display: flex; flex-direction: column; gap: 0.3em; flex: none; }
  .detail-actions button {
    font-family: inherit;
    font-size: clamp(0.48rem, 1.6vw, 0.62rem);
    letter-spacing: 0.04em;
    padding: 0.5em 0.7em;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #btnConfirmStarter { background: var(--gb-darkest); color: var(--gb-lightest); border: 2px solid var(--gb-darkest); }
  #btnCancelStarter { background: transparent; color: var(--gb-darkest); border: 1px solid var(--gb-darkest); }

  /* ---------- Battle view ---------- */
  #view-battle { inset: 0; }
  .battle-sprite {
    position: absolute;
    image-rendering: pixelated;
    object-fit: contain;
  }
  #enemySprite { left: 6%; top: 5%; width: 34%; height: 36%; }
  #playerSprite { left: 58%; top: 39%; width: 34%; height: 28%; }

  .info-panel {
    position: absolute;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 5px;
    padding: 2% 4%;
  }
  #enemyPanel { left: 46%; top: 4%; width: 48%; height: 26%; }
  #playerPanel { left: 4%; top: 37%; width: 46%; height: 29%; }
  .info-panel__row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: clamp(0.5rem, 1.7vw, 0.72rem);
  }
  .info-panel__name { font-weight: 700; }
  .hp-track {
    margin-top: 4%;
    height: 14%;
    min-height: 6px;
    background: var(--gb-darkest);
    border-radius: 3px;
    overflow: hidden;
  }
  .hp-fill { height: 100%; width: 100%; background: var(--hp-green); transition: width 0.4s steps(10); }
  .hp-numeric {
    margin-top: 2%;
    text-align: right;
    font-size: clamp(0.46rem, 1.5vw, 0.6rem);
    font-variant-numeric: tabular-nums;
    color: var(--gb-dark);
  }

  .battle-bottom {
    position: absolute;
    left: 0;
    top: 68%;
    width: 100%;
    height: 31%;
    display: flex;
    gap: 2%;
    padding: 0 1.5%;
  }
  .battle-bottom > * { min-width: 0; }
  .message-box {
    flex: 0 0 60%;
    background: var(--paper);
    border: 3px solid var(--gb-darkest);
    border-radius: 6px;
    padding: 3% 4%;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
  }
  #msgLabel {
    font-size: clamp(0.52rem, 1.9vw, 0.76rem);
    line-height: 1.35;
  }
  #msgIndicator {
    position: absolute;
    right: 6%;
    bottom: 6%;
    font-size: 0.8em;
    animation: blink 0.8s steps(1) infinite;
  }
  #msgIndicator.hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { #msgIndicator { animation: none; } }

  .menu-grid, .move-menu {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3%;
    align-content: center;
  }
  .move-menu { grid-template-rows: 1fr 1fr auto; }
  .move-menu .menu-btn:nth-child(3),
  .move-menu .menu-btn:nth-child(4) { grid-row: 2; }
  #btnMoveBack { grid-column: 1 / -1; grid-row: 3; }
  .menu-grid.hidden, .move-menu.hidden { display: none; }
  .menu-btn {
    font-family: inherit;
    font-size: clamp(0.5rem, 1.7vw, 0.68rem);
    letter-spacing: 0.03em;
    background: var(--paper);
    border: 2px solid var(--gb-darkest);
    border-radius: 4px;
    color: var(--gb-darkest);
    cursor: pointer;
    touch-action: manipulation;
    min-width: 0;
    padding: 0.2em 0.3em;
    overflow-wrap: anywhere;
  }
  .menu-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .menu-btn:active:not(:disabled) { transform: translateY(1px); }

  .result-overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--gb-darkest) 90%, transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1em;
    text-align: center;
    padding: 8%;
  }
  .result-overlay.hidden { display: none; }
  #resultLabel {
    color: var(--gb-lightest);
    font-size: clamp(0.72rem, 2.6vw, 1rem);
    text-wrap: balance;
  }
  #btnBackToTitle {
    font-family: inherit;
    font-size: clamp(0.6rem, 2vw, 0.78rem);
    letter-spacing: 0.06em;
    padding: 0.7em 1.4em;
    background: var(--gb-lightest);
    color: var(--gb-darkest);
    border: 2px solid var(--gb-lightest);
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* ---------- Decorative controls ---------- */
  .console__controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 0.4rem 0.2rem;
  }
  .dpad { position: relative; width: 78px; height: 78px; flex: none; }
  .dpad span {
    position: absolute;
    background: linear-gradient(160deg, #2b2a38, #17161f);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset;
  }
  .dpad__up, .dpad__down { left: 29px; width: 20px; height: 78px; border-radius: 3px; }
  .dpad__left, .dpad__right { top: 29px; width: 78px; height: 20px; border-radius: 3px; }
  .dpad__center {
    left: 29px; top: 29px; width: 20px; height: 20px;
    background: #17161f; border-radius: 2px;
  }
  .ab-buttons { display: flex; align-items: flex-end; gap: 10px; transform: rotate(-18deg); }
  .btn-a, .btn-b {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; color: var(--shell-shadow);
    background: linear-gradient(160deg, #8c8ba0, var(--shell-lo));
    box-shadow: 0 3px 0 var(--shell-shadow), 0 4px 6px rgba(0, 0, 0, 0.3);
  }
  .btn-a { margin-bottom: 10px; }

  .console__meta {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.5rem 0 0.3rem;
    transform: rotate(-18deg);
  }
  .pill-btn {
    font-family: inherit;
    font-size: 0.5rem;
    letter-spacing: 0.05em;
    color: var(--shell-shadow);
    background: linear-gradient(160deg, #8c8ba0, var(--shell-lo));
    border: none;
    border-radius: 8px;
    padding: 0.35em 0.9em;
    box-shadow: 0 2px 0 var(--shell-shadow);
    cursor: pointer;
    touch-action: manipulation;
  }
  .pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pill-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }

  .console__speaker {
    position: absolute;
    right: clamp(0.8rem, 2.4vw, 1.7rem);
    bottom: 0.9rem;
    width: 46px;
    height: 30px;
    background:
      repeating-linear-gradient(-35deg, var(--shell-shadow) 0 3px, transparent 3px 8px);
    opacity: 0.6;
  }

  button { font: inherit; }
  button:focus-visible, .starter-card:focus-visible, .message-box:focus-visible {
    outline: 2px solid var(--led-red);
    outline-offset: 2px;
  }

  @media (max-width: 480px), (max-height: 520px) {
    .console__controls, .console__speaker { display: none; }
    .console__meta { transform: none; padding-top: 0.2rem; }
    .console {
      width: min(96vw, 720px, calc((100vh - 11.5rem) * 1.55));
      padding-top: 0.5rem;
    }
    .console__top { padding-bottom: 0.3rem; }
    .page { gap: 0.4rem; padding: 0.4rem; }
    .page__hint { font-size: 0.6rem; }

    /* Menus em coluna única: com o ecrã comprimido, um grid 2x2 espreme
       demais o texto dos botões (ex.: "Chicote de Vinha"). Uma lista
       vertical dá a cada botão a largura toda da área de menu. */
    .menu-grid, .move-menu {
      grid-template-columns: 1fr;
      grid-template-rows: none;
    }
    .move-menu .menu-btn:nth-child(3),
    .move-menu .menu-btn:nth-child(4),
    #btnMoveBack {
      grid-column: auto;
      grid-row: auto;
    }
    .menu-grid, .move-menu { gap: 1%; }
    .menu-btn {
      font-size: clamp(0.4rem, 1.6vw, 0.58rem);
      line-height: 1.05;
      padding: 0.08em 0.3em;
    }

    /* Rouba espaço da área de sprites para dar mais altura ao menu,
       que agora empilha em coluna única e precisa de mais linhas. */
    #enemySprite { height: 28%; }
    #enemyPanel { height: 22%; }
    #playerSprite { top: 32%; height: 24%; }
    #playerPanel { top: 32%; height: 27%; padding: 1% 4%; }
    .hp-numeric { margin-top: 0; }
    .battle-bottom { top: 61%; height: 38%; }
  }
</style>

<div class="page">
  <div class="console">
    <div class="console__top">
      <span class="console__led" aria-hidden="true"></span>
      <span class="console__brand">POCKET BATTLE</span>
    </div>

    <div class="console__screen-frame">
      <div class="screen" id="screen">
        <section class="view" id="view-title">
          <h1 class="title-heading">POCKET BATTLE<br>TURN DEMO</h1>
          <p class="title-sub">um sistema de batalha por turnos estilo Pokémon FireRed</p>
          <button class="btn-play" id="btnPlay" type="button">JOGAR</button>
          <p class="title-blink">toque em JOGAR ou START para começar</p>
        </section>

        <section class="view hidden" id="view-select">
          <h2 class="select-title">Escolha seu inicial</h2>
          <div class="select-body">
            <nav class="region-list" id="regionList" aria-label="Regiões"></nav>
            <div class="starter-scroll">
              <div class="starter-grid" id="starterGrid"></div>
            </div>
          </div>
          <div class="detail-panel hidden" id="detailPanel">
            <img id="detailSprite" alt="">
            <div class="detail-info">
              <h3 id="detailName">Nome</h3>
              <p id="detailStats">Status</p>
            </div>
            <div class="detail-actions">
              <button id="btnConfirmStarter" type="button">ESCOLHER</button>
              <button id="btnCancelStarter" type="button">CANCELAR</button>
            </div>
          </div>
        </section>

        <section class="view hidden" id="view-battle">
          <img class="battle-sprite" id="enemySprite" alt="Pokémon inimigo">
          <div class="info-panel" id="enemyPanel">
            <div class="info-panel__row">
              <span class="info-panel__name" id="enemyName">???</span>
              <span id="enemyLevel">Nv5</span>
            </div>
            <div class="hp-track"><div class="hp-fill" id="enemyHpFill"></div></div>
          </div>

          <img class="battle-sprite" id="playerSprite" alt="Seu Pokémon">
          <div class="info-panel" id="playerPanel">
            <div class="info-panel__row">
              <span class="info-panel__name" id="playerName">???</span>
              <span id="playerLevel">Nv5</span>
            </div>
            <div class="hp-track"><div class="hp-fill" id="playerHpFill"></div></div>
            <div class="hp-numeric" id="playerHpNumeric">20/20</div>
          </div>

          <div class="battle-bottom">
            <div class="message-box" id="messageBox" role="button" tabindex="0" aria-label="Toque para continuar">
              <span id="msgLabel">...</span>
              <span id="msgIndicator" class="hidden">▼</span>
            </div>
            <div class="menu-grid hidden" id="actionMenu">
              <button class="menu-btn" id="btnFight" type="button">LUTAR</button>
              <button class="menu-btn" id="btnBag" type="button" disabled>MOCHILA</button>
              <button class="menu-btn" id="btnPokemon" type="button" disabled>POKÉMON</button>
              <button class="menu-btn" id="btnRun" type="button">FUGIR</button>
            </div>
            <div class="move-menu hidden" id="moveMenu">
              <button class="menu-btn" id="btnMoveBack" type="button">VOLTAR</button>
            </div>
          </div>

          <div class="result-overlay hidden" id="resultOverlay">
            <p id="resultLabel">Resultado</p>
            <button id="btnBackToTitle" type="button">VOLTAR AO MENU</button>
          </div>
        </section>
      </div>
    </div>

    <div class="console__controls">
      <div class="dpad" aria-hidden="true">
        <span class="dpad__up"></span><span class="dpad__down"></span>
        <span class="dpad__left"></span><span class="dpad__right"></span>
        <span class="dpad__center"></span>
      </div>
      <div class="ab-buttons" aria-hidden="true">
        <span class="btn-b">B</span><span class="btn-a">A</span>
      </div>
    </div>
    <div class="console__meta">
      <button class="pill-btn" id="btnStart" type="button">START</button>
      <button class="pill-btn" type="button" disabled>SELECT</button>
    </div>
    <div class="console__speaker"></div>
  </div>
  <p class="page__hint">Funciona no PC e no celular — não precisa instalar nada</p>
</div>

<script>
(function () {
  "use strict";

  // ---------- Pokédex da demo (mesmos dados do projeto Godot) ----------
  var RAW_SPECIES = [
    [1, "Bulbasaur", "Kanto", "Grama", "Veneno", 45, 49, 49, 45, "#59bf66", "Chicote de Vinha", 45],
    [2, "Charmander", "Kanto", "Fogo", "", 39, 52, 43, 65, "#f27340", "Brasa", 40],
    [3, "Squirtle", "Kanto", "Água", "", 44, 48, 65, 43, "#598cf2", "Jato d'Água", 40],
    [4, "Chikorita", "Johto", "Grama", "", 45, 49, 65, 45, "#66cc73", "Folha Navalha", 45],
    [5, "Cyndaquil", "Johto", "Fogo", "", 39, 52, 43, 65, "#e68033", "Brasa", 40],
    [6, "Totodile", "Johto", "Água", "", 50, 65, 64, 43, "#4080d9", "Investida d'Água", 45],

    [10, "Turtwig", "Sinnoh", "Grama", "", 55, 68, 64, 31, "#73b359", "Investida de Folhas", 45],
    [11, "Chimchar", "Sinnoh", "Fogo", "", 44, 58, 44, 61, "#e68c40", "Brasa", 40],
    [12, "Piplup", "Sinnoh", "Água", "", 53, 51, 53, 40, "#4d80d9", "Bolha", 40],
    [13, "Snivy", "Unova", "Grama", "", 45, 45, 55, 63, "#66cc66", "Chicote de Vinha", 45],
    [14, "Tepig", "Unova", "Fogo", "", 65, 63, 45, 45, "#e67340", "Brasa", 40],
    [15, "Oshawott", "Unova", "Água", "", 55, 55, 45, 45, "#4d8ce6", "Jato d'Água", 40],
    [16, "Chespin", "Kalos", "Grama", "", 56, 61, 65, 38, "#8cbf4d", "Investida de Folhas", 45],
    [17, "Fennekin", "Kalos", "Fogo", "", 40, 45, 40, 60, "#f2a659", "Brasa", 40],
    [18, "Froakie", "Kalos", "Água", "", 41, 56, 40, 71, "#4d99d9", "Jato d'Água", 40],
    [19, "Rowlet", "Alola", "Grama", "Voador", 68, 55, 55, 42, "#73b366", "Investida de Folhas", 45],
    [20, "Litten", "Alola", "Fogo", "", 45, 65, 40, 70, "#d9594d", "Brasa", 40],
    [21, "Popplio", "Alola", "Água", "", 50, 54, 54, 40, "#59a6e6", "Jato d'Água", 40],
    [22, "Grookey", "Galar", "Grama", "", 50, 65, 50, 65, "#66cc59", "Investida de Folhas", 45],
    [23, "Scorbunny", "Galar", "Fogo", "", 50, 71, 40, 69, "#f2804d", "Brasa", 40],
    [24, "Sobble", "Galar", "Água", "", 50, 40, 40, 70, "#6699e6", "Jato d'Água", 40],
    [25, "Decidueye de Hisui", "Hisui", "Grama", "Lutador", 78, 107, 75, 100, "#599959", "Folha Navalha", 55],
    [26, "Typhlosion de Hisui", "Hisui", "Fogo", "Fantasma", 73, 84, 78, 100, "#8c59bf", "Chama Fantasma", 55],
    [27, "Samurott de Hisui", "Hisui", "Água", "Sombrio", 90, 108, 80, 85, "#40668c", "Corte Noturno", 55],
    [28, "Sprigatito", "Paldea", "Grama", "", 40, 61, 54, 65, "#66bf73", "Arranhão", 45],
    [29, "Fuecoco", "Paldea", "Fogo", "", 67, 45, 59, 36, "#e6664d", "Brasa", 40],
    [30, "Quaxly", "Paldea", "Água", "", 55, 65, 45, 50, "#4da6d9", "Bicada", 40]
  ];

  var REGIONS = ["Kanto", "Johto", "Hoenn", "Sinnoh", "Unova", "Kalos", "Alola", "Galar", "Hisui", "Paldea"];

  var BASE_MOVE = { name: "Investida", type: "Normal", power: 35, accuracy: 100 };

  var SPECIES = RAW_SPECIES.map(function (r) {
    return {
      id: r[0], name: r[1], region: r[2], type1: r[3], type2: r[4],
      hp: r[5], atk: r[6], def: r[7], spd: r[8], color: r[9],
      move: { name: r[10], type: r[3], power: r[11], accuracy: 95 }
    };
  });

  function typeLabel(sp) { return sp.type2 ? (sp.type1 + "/" + sp.type2) : sp.type1; }

  // ---------- Gerador de sprite em pixel art (determinístico por id) ----------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hexToRgb(hex) {
    var n = parseInt(hex.replace("#", ""), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function clamp255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function lighten(rgb, amt) { return rgb.map(function (c) { return clamp255(c + (255 - c) * amt); }); }
  function darken(rgb, amt) { return rgb.map(function (c) { return clamp255(c * (1 - amt)); }); }
  function shadeVariant(rgb, amt) { return amt >= 0 ? lighten(rgb, amt) : darken(rgb, -amt); }

  function generateSpriteDataUrl(id, colorHex) {
    var size = 16;
    var rng = mulberry32((id * 2654435761) >>> 0);
    var base = hexToRgb(colorHex);
    var outline = darken(base, 0.6);
    var canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext("2d");
    var img = ctx.createImageData(size, size);

    function setPx(x, y, rgb, a) {
      var i = (y * size + x) * 4;
      img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = a;
    }

    var half = size / 2;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < half; x++) {
        var edge = x < 1 || y < 1 || y > size - 2;
        var density = edge ? 0.3 : 0.62;
        if (rng() < density) {
          var shade = shadeVariant(base, rng() * 0.4 - 0.15);
          setPx(x, y, shade, 255);
          setPx(size - 1 - x, y, shade, 255);
        }
      }
    }

    var before = img.data.slice();
    var offsets = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var yy = 0; yy < size; yy++) {
      for (var xx = 0; xx < size; xx++) {
        var i0 = (yy * size + xx) * 4;
        if (before[i0 + 3] > 0) continue;
        var hasNeighbor = false;
        for (var k = 0; k < offsets.length; k++) {
          var nx = xx + offsets[k][0], ny = yy + offsets[k][1];
          if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
          var ni = (ny * size + nx) * 4;
          if (before[ni + 3] > 0) { hasNeighbor = true; break; }
        }
        if (hasNeighbor) setPx(xx, yy, outline, 255);
      }
    }

    ctx.putImageData(img, 0, 0);
    return canvas.toDataURL();
  }

  var spriteCache = {};
  function spriteFor(sp) {
    if (!spriteCache[sp.id]) spriteCache[sp.id] = generateSpriteDataUrl(sp.id, sp.color);
    return spriteCache[sp.id];
  }

  // ---------- Modelo de batalha (Ataque vs Defesa, ordem por Velocidade) ----------
  function BattlePokemon(species, level) {
    this.species = species;
    this.level = level;
    this.maxHp = Math.floor((2 * species.hp * level) / 100) + level + 10;
    this.atk = Math.floor((2 * species.atk * level) / 100) + 5;
    this.def = Math.floor((2 * species.def * level) / 100) + 5;
    this.spd = Math.floor((2 * species.spd * level) / 100) + 5;
    this.hp = this.maxHp;
    this.moves = [BASE_MOVE, species.move];
  }
  BattlePokemon.prototype.isFainted = function () { return this.hp <= 0; };
  BattlePokemon.prototype.takeDamage = function (n) { this.hp = Math.max(0, this.hp - n); };
  BattlePokemon.prototype.hpRatio = function () { return this.maxHp <= 0 ? 0 : this.hp / this.maxHp; };

  // Fórmula SIMPLES pedida: dano ~ (Ataque / Defesa) * Poder do golpe, com
  // variação aleatória de 85%-100% (igual ao "roll" de dano dos jogos).
  function calculateDamage(attacker, defender, move) {
    var ratio = attacker.atk / Math.max(1, defender.def);
    var raw = ratio * move.power * 0.5;
    var randomFactor = 0.85 + Math.random() * 0.15;
    return Math.max(1, Math.round(raw * randomFactor));
  }

  function hpColor(ratio) {
    if (ratio > 0.5) return "var(--hp-green)";
    if (ratio > 0.2) return "var(--hp-yellow)";
    return "var(--hp-red)";
  }

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var views = { title: $("view-title"), select: $("view-select"), battle: $("view-battle") };
  function showView(name) {
    Object.keys(views).forEach(function (k) { views[k].classList.toggle("hidden", k !== name); });
  }

  var regionListEl = $("regionList");
  var starterGridEl = $("starterGrid");
  var detailPanel = $("detailPanel");
  var detailSprite = $("detailSprite");
  var detailName = $("detailName");
  var detailStats = $("detailStats");

  var pendingSpecies = null;

  function buildRegionTabs() {
    REGIONS.forEach(function (region) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "region-btn";
      btn.textContent = region;
      btn.addEventListener("click", function () { selectRegion(region, btn); });
      regionListEl.appendChild(btn);
    });
  }

  function selectRegion(region, btnEl) {
    Array.prototype.forEach.call(regionListEl.children, function (c) { c.classList.remove("active"); });
    if (btnEl) btnEl.classList.add("active");
    starterGridEl.innerHTML = "";
    SPECIES.filter(function (s) { return s.region === region; }).forEach(function (sp) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "starter-card";
      var img = document.createElement("img");
      img.src = spriteFor(sp);
      img.alt = sp.name;
      var label = document.createElement("span");
      label.textContent = sp.name;
      card.appendChild(img);
      card.appendChild(label);
      card.addEventListener("click", function () { showDetail(sp); });
      starterGridEl.appendChild(card);
    });
  }

  function showDetail(sp) {
    pendingSpecies = sp;
    detailSprite.src = spriteFor(sp);
    detailSprite.alt = sp.name;
    detailName.textContent = sp.name + " (" + sp.region + ")";
    detailStats.textContent = "Tipo: " + typeLabel(sp) +
      "\nHP " + sp.hp + "   ATK " + sp.atk + "   DEF " + sp.def + "   VEL " + sp.spd;
    detailPanel.classList.remove("hidden");
  }

  $("btnConfirmStarter").addEventListener("click", function () {
    if (!pendingSpecies) return;
    detailPanel.classList.add("hidden");
    startGame(pendingSpecies);
  });
  $("btnCancelStarter").addEventListener("click", function () {
    pendingSpecies = null;
    detailPanel.classList.add("hidden");
  });

  $("btnPlay").addEventListener("click", function () { showView("select"); });

  // ---------- Batalha ----------
  var enemySprite = $("enemySprite"), playerSprite = $("playerSprite");
  var enemyName = $("enemyName"), enemyLevel = $("enemyLevel"), enemyHpFill = $("enemyHpFill");
  var playerName = $("playerName"), playerLevel = $("playerLevel"), playerHpFill = $("playerHpFill"), playerHpNumeric = $("playerHpNumeric");
  var messageBox = $("messageBox"), msgLabel = $("msgLabel"), msgIndicator = $("msgIndicator");
  var actionMenu = $("actionMenu"), moveMenu = $("moveMenu"), moveBackBtn = $("btnMoveBack");
  var btnFight = $("btnFight"), btnRun = $("btnRun");
  var resultOverlay = $("resultOverlay"), resultLabel = $("resultLabel");
  var btnStart = $("btnStart");

  var ackResolve = null;
  function showMessage(text) {
    msgLabel.textContent = text;
    msgIndicator.classList.remove("hidden");
    hideMenus();
    return new Promise(function (resolve) { ackResolve = resolve; });
  }
  function acknowledge() {
    if (ackResolve) {
      var r = ackResolve; ackResolve = null;
      msgIndicator.classList.add("hidden");
      r();
    }
  }
  messageBox.addEventListener("click", acknowledge);
  messageBox.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") acknowledge(); });

  function hideMenus() { actionMenu.classList.add("hidden"); moveMenu.classList.add("hidden"); }

  function updateHpUi(bp, isPlayer) {
    var ratio = bp.hpRatio();
    var fill = isPlayer ? playerHpFill : enemyHpFill;
    fill.style.width = (ratio * 100) + "%";
    fill.style.background = hpColor(ratio);
    if (isPlayer) playerHpNumeric.textContent = bp.hp + "/" + bp.maxHp;
  }

  function setupBattleUi(playerBp, enemyBp) {
    enemySprite.src = spriteFor(enemyBp.species);
    enemyName.textContent = enemyBp.species.name;
    enemyLevel.textContent = "Nv" + enemyBp.level;
    updateHpUi(enemyBp, false);

    playerSprite.src = spriteFor(playerBp.species);
    playerName.textContent = playerBp.species.name;
    playerLevel.textContent = "Nv" + playerBp.level;
    updateHpUi(playerBp, true);

    moveMenu.innerHTML = "";
    playerBp.moves.forEach(function (mv) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "menu-btn";
      b.textContent = mv.name + " (" + mv.type + ")";
      moveMenu.appendChild(b);
    });
    moveMenu.appendChild(moveBackBtn);

    resultOverlay.classList.add("hidden");
  }

  function waitForPlayerAction(playerBp) {
    return new Promise(function (resolve) {
      hideMenus();
      actionMenu.classList.remove("hidden");
      msgLabel.textContent = "O que " + playerBp.species.name + " fará?";

      btnFight.onclick = function () {
        actionMenu.classList.add("hidden");
        moveMenu.classList.remove("hidden");
        var moveButtons = moveMenu.querySelectorAll(".menu-btn:not(#btnMoveBack)");
        moveButtons.forEach(function (btn, idx) {
          btn.onclick = function () { resolve({ type: "move", move: playerBp.moves[idx] }); };
        });
        moveBackBtn.onclick = function () {
          moveMenu.classList.add("hidden");
          actionMenu.classList.remove("hidden");
        };
      };
      btnRun.onclick = function () { hideMenus(); resolve({ type: "run" }); };
    });
  }

  async function executeMove(attacker, defender, move, attackerIsPlayer) {
    await showMessage(attacker.species.name + " usou " + move.name + "!");
    if (Math.random() * 100 > move.accuracy) {
      await showMessage("O ataque errou!");
      return;
    }
    var damage = calculateDamage(attacker, defender, move);
    defender.takeDamage(damage);
    updateHpUi(defender, !attackerIsPlayer);
    await showMessage("Causou " + damage + " de dano em " + defender.species.name + "!");
  }

  async function endBattle(result) {
    hideMenus();
    await new Promise(function (r) { setTimeout(r, 900); });
    if (result === "run") resultLabel.textContent = "Você fugiu da batalha.";
    else if (result === "win") resultLabel.textContent = "Você venceu a batalha!";
    else resultLabel.textContent = "Seu Pokémon desmaiou...";
    resultOverlay.classList.remove("hidden");
  }

  async function runBattle(playerSpecies) {
    var playerBp = new BattlePokemon(playerSpecies, 5);
    var enemySpecies;
    do { enemySpecies = SPECIES[Math.floor(Math.random() * SPECIES.length)]; }
    while (enemySpecies.id === playerSpecies.id && SPECIES.length > 1);
    var enemyLevelValue = Math.max(2, 5 + Math.floor(Math.random() * 4) - 1);
    var enemyBp = new BattlePokemon(enemySpecies, enemyLevelValue);

    setupBattleUi(playerBp, enemyBp);

    await showMessage("Um " + enemyBp.species.name + " selvagem apareceu!");
    await showMessage("Vai, " + playerBp.species.name + "!");

    while (true) {
      var action = await waitForPlayerAction(playerBp);
      if (action.type === "run") {
        await showMessage("Você fugiu da batalha com segurança!");
        await endBattle("run");
        return;
      }

      var playerMove = action.move;
      var enemyMove = enemyBp.moves[Math.floor(Math.random() * enemyBp.moves.length)];
      var playerFirst = playerBp.spd >= enemyBp.spd;
      var order = playerFirst
        ? [[playerBp, enemyBp, playerMove, true], [enemyBp, playerBp, enemyMove, false]]
        : [[enemyBp, playerBp, enemyMove, false], [playerBp, enemyBp, playerMove, true]];

      var battleOver = false;
      for (var i = 0; i < order.length; i++) {
        var turn = order[i];
        await executeMove(turn[0], turn[1], turn[2], turn[3]);
        var def = turn[1];
        if (def.isFainted()) {
          var defIsEnemy = turn[3] === true;
          await showMessage(def.species.name + (defIsEnemy ? " inimigo" : "") + " desmaiou!");
          await endBattle(defIsEnemy ? "win" : "lose");
          battleOver = true;
          break;
        }
      }
      if (battleOver) return;
    }
  }

  function startGame(species) {
    showView("battle");
    runBattle(species);
  }

  $("btnBackToTitle").addEventListener("click", function () {
    resultOverlay.classList.add("hidden");
    showView("title");
  });

  btnStart.addEventListener("click", function () {
    if (!views.title.classList.contains("hidden")) { showView("select"); return; }
    acknowledge();
  });

  // ---------- Boot ----------
  buildRegionTabs();
  selectRegion(REGIONS[0], regionListEl.children[0]);
  showView("title");
})();
</script>
