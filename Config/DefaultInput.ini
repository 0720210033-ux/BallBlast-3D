; House of Sanity uses Enhanced Input exclusively. There is nothing to bind
; here - create these assets in the editor and assign them on
; AHouseOfSanityCharacter's defaults (see README.md "Editor setup"):
;   IMC_Default          (Input Mapping Context)
;   IA_Move   (Axis2D)   -> WASD / left stick
;   IA_Look   (Axis2D)   -> Mouse XY / right stick
;   IA_Interact (Digital)-> E / gamepad face button

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=True
bAltEnterTogglesFullscreen=True
